name: Publicar Reporte Automatizado

on:
  workflow_dispatch:
    inputs:
      report_file:
        description: 'Ruta al archivo de reporte YAML'
        required: false
        default: 'reporte.yml'

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Ejecutar parser y publicar Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python parse_report.py ${{ github.event.inputs.report_file }}
